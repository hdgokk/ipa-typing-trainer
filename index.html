<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPA 打字课 · 工作台</title>
<style>
:root{
  --bg:#ffffff;
  --surface:#f4f6f7;
  --surface-2:#eef1f2;
  --surface-3:#e5e9eb;
  --line:rgba(16,20,26,.11);
  --line-strong:rgba(16,20,26,.20);
  --text:#1a1d21;
  --text-2:#5a6068;
  --text-3:#5e656e;
  --accent:#0d6e67;
  --accent-dim:rgba(13,110,103,.09);
  --accent-line:rgba(13,110,103,.34);
  --bad:#b83528;
  --bad-dim:rgba(184,53,40,.10);
  --warn:#965200;
  --key:#3b5bdb;
  --shadow:0 1px 2px rgba(16,20,26,.05),0 8px 24px rgba(16,20,26,.06);
  --ease:cubic-bezier(.22,1,.36,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,"Courier New",monospace;
  --ipa:"IPAPANNEW","Doulos SIL","Charis SIL",Cambria,"Times New Roman",serif;
  --left-w:264px;
  --right-w:336px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
}
::selection{background:rgba(13,110,103,.20);color:#0b2e2a}
button{font-family:inherit}
/* 键盘焦点可见性：浅色底上必须显式定义，否则焦点环几乎不可见 */
button:focus-visible,
a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(16,20,26,.16);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(16,20,26,.28)}
::-webkit-scrollbar-track{background:transparent}

#app{
  display:grid;
  grid-template-columns:var(--left-w) minmax(0,1fr) var(--right-w);
  height:100vh;
}
#app.right-hidden{grid-template-columns:var(--left-w) minmax(0,1fr) 0}
#app.left-hidden{grid-template-columns:0 minmax(0,1fr) var(--right-w)}

/* ============ 左：目录 / 进度 ============ */
#left{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#left-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(13,110,103,.16)}
.brand-name{font-size:13px;font-weight:500;letter-spacing:.08em}
.brand-ver{font-size:10px;color:var(--text-3);letter-spacing:.1em;margin-left:auto}
.prog-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.prog-label{font-size:11px;color:var(--text-3);letter-spacing:.14em}
.prog-num{font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.prog-track{height:3px;background:rgba(16,20,26,.10);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),rgba(13,110,103,.55));border-radius:99px;transition:width .6s var(--ease)}
#toc{flex:1;overflow-y:auto;padding:10px 10px 20px}
.toc-sec{font-size:10px;color:var(--text-3);letter-spacing:.18em;padding:12px 8px 7px}
.toc-free{
  display:flex;align-items:center;gap:9px;width:100%;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:9px;padding:9px 11px;margin-bottom:4px;
  color:var(--text-2);font-size:12.5px;cursor:pointer;text-align:left;
  transition:all .25s var(--ease);
}
.toc-free:hover{border-color:var(--line-strong);color:var(--text)}
.toc-free.on{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.toc-free .ic{font-size:13px;opacity:.85}
.toc-free .ct{margin-left:auto;font-size:10.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.toc-free.on .ct{color:var(--accent)}

.toc-item{
  display:flex;align-items:center;gap:8px;width:100%;
  background:none;border:none;border-radius:8px;
  padding:7px 9px;margin-bottom:1px;
  color:var(--text-2);font-size:12.5px;cursor:pointer;text-align:left;
  transition:background .2s var(--ease),color .2s var(--ease);
}
.toc-item:hover{background:rgba(16,20,26,.045);color:var(--text)}
.toc-item.on{background:var(--accent-dim);color:var(--accent)}
.toc-item .tw{
  width:16px;height:16px;flex:none;border-radius:5px;
  display:flex;align-items:center;justify-content:center;
  font-size:9px;color:var(--text-3);
  border:1px solid var(--line);
}
.toc-item.done .tw{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.toc-item.on .tw{border-color:var(--accent-line);color:var(--accent)}
.toc-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-item .mini{font-size:10px;color:var(--text-3);font-variant-numeric:tabular-nums}
.toc-item.done .mini{color:rgba(13,110,103,.62)}
.toc-caret{
  width:14px;flex:none;color:var(--text-3);font-size:9px;
  transition:transform .25s var(--ease);
}
.toc-caret.open{transform:rotate(90deg)}
.toc-steps{
  margin:0 0 4px 12px;padding-left:9px;
  border-left:1px solid var(--line);
  overflow:hidden;
}
.toc-step{
  display:flex;align-items:center;gap:7px;width:100%;
  background:none;border:none;border-radius:6px;
  padding:5px 8px;margin-bottom:1px;
  color:var(--text-3);font-size:11.5px;cursor:pointer;text-align:left;
  transition:all .2s var(--ease);
}
.toc-step:hover{background:rgba(16,20,26,.05);color:var(--text)}
.toc-step.on{background:var(--accent-dim);color:var(--accent)}
.toc-step.done{color:var(--text-2)}
.toc-step .k{
  font-size:8.5px;width:15px;height:15px;flex:none;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);color:var(--text-3);letter-spacing:0;
}
.toc-step.on .k{border-color:var(--accent-line);color:var(--accent)}
.toc-step.done .k{color:var(--accent);border-color:rgba(13,110,103,.30)}
.toc-step .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============ 中：主体学习区 ============ */
#stage{
  position:relative;display:flex;flex-direction:column;
  min-width:0;overflow:hidden;background:
    radial-gradient(900px 520px at 50% 42%,rgba(13,110,103,.05),transparent 68%),
    var(--bg);
}
#stage-head{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;border-bottom:1px solid var(--line);
  flex:none;
}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--text-3)}
.crumb b{color:var(--text-2);font-weight:500}
.crumb .sep{opacity:.45}
.crumb .cur{color:var(--accent)}
.stage-tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.tool{
  background:none;border:1px solid transparent;color:var(--text-3);
  padding:6px 9px;border-radius:8px;cursor:pointer;font-size:11.5px;
  display:flex;align-items:center;gap:6px;
  transition:all .25s var(--ease);
}
.tool:hover{color:var(--accent);background:var(--accent-dim);border-color:var(--accent-line)}
.tool svg{width:15px;height:15px}
.tool.off{opacity:.5}

#flow{
  flex:1;min-height:0;overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  padding:clamp(20px,4vh,48px) 34px 24px;
  transition:opacity .26s var(--ease),transform .26s var(--ease),filter .26s var(--ease);
}
#flow.leaving{opacity:0;transform:translateY(-10px) scale(.99);filter:blur(5px)}
/* 内容不足一屏时居中偏上；超出时保持顶对齐不裁切 */
.stage-inner{width:100%;max-width:660px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center}
/* 白底无氛围光填充，内容偏上可减轻空旷感 */
#flow{padding-top:clamp(16px,2.5vh,30px)}

#prompt{
  font-size:clamp(16px,1.5vw,19px);font-weight:300;
  letter-spacing:.02em;line-height:2.05;max-width:640px;color:var(--text);
}
#prompt .ch{display:inline-block;opacity:0;animation:chIn .5s var(--ease) forwards}
@keyframes chIn{from{opacity:0;transform:translateY(9px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
#prompt a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
#prompt code{
  font-family:var(--mono);font-size:.86em;
  background:rgba(13,110,103,.07);border:1px solid rgba(13,110,103,.22);
  padding:1px 6px;border-radius:5px;color:var(--accent);
}

#quiz-char{
  font-size:clamp(48px,7vw,76px);font-weight:200;letter-spacing:.04em;
  margin-top:22px;animation:charIn .65s var(--ease) both;
}
@keyframes charIn{from{opacity:0;transform:scale(.92) translateY(8px);filter:blur(7px)}to{opacity:1;transform:none;filter:blur(0)}}
#quiz-pinyin{
  font-size:clamp(14px,1.6vw,18px);color:var(--text-2);
  margin-top:8px;letter-spacing:.12em;font-weight:300;
  animation:chIn .55s .1s var(--ease) both;
}
.say-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:6px;
  background:none;border:1px solid var(--line);color:var(--text-2);
  border-radius:99px;padding:6px 14px;font-size:12px;cursor:pointer;
  transition:all .25s var(--ease);
}
.say-btn:hover{color:var(--accent);border-color:var(--accent-line);background:var(--accent-dim)}
.say-btn svg{width:14px;height:14px;flex:none}

#echo{
  font-family:var(--ipa);
  font-size:clamp(28px,3.8vw,38px);
  color:var(--accent);
  min-height:1.35em;margin-top:28px;
  letter-spacing:.05em;word-break:break-all;max-width:100%;
  text-shadow:none;
  transition:color .25s var(--ease);
}
#echo.pop{animation:pop .2s var(--ease)}
@keyframes pop{from{transform:scale(1.03)}to{transform:scale(1)}}
#echo::after{content:"";display:inline-block;width:1.5px;height:.92em;background:var(--accent);margin-left:4px;vertical-align:-.08em;animation:blink 1.15s var(--ease) infinite;border-radius:1px}
#echo:empty::after{opacity:.28}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#echo.ok{color:var(--accent);text-shadow:none}
#echo.bad{color:var(--bad);text-shadow:none}
.shake{animation:shake .38s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-9px)}48%{transform:translateX(7px)}72%{transform:translateX(-4px)}90%{transform:translateX(3px)}}

/* ===== 反馈卡：定位到具体音位 ===== */
#feedback{
  width:100%;max-width:560px;margin-top:20px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:13px;padding:14px 16px;text-align:left;
  box-shadow:var(--shadow);
  display:none;
}
#feedback.show{display:block;animation:fbIn .32s var(--ease) both}
@keyframes fbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#feedback.bad{border-color:rgba(184,53,40,.30);background:linear-gradient(180deg,rgba(184,53,40,.045),var(--surface-2))}
#feedback.ok{border-color:rgba(13,110,103,.28);background:linear-gradient(180deg,rgba(13,110,103,.045),var(--surface-2))}
#feedback.warn{border-color:rgba(150,82,0,.28);background:linear-gradient(180deg,rgba(150,82,0,.045),var(--surface-2))}
.fb-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.fb-badge{
  font-size:10px;letter-spacing:.14em;padding:2px 8px;border-radius:99px;
  background:rgba(184,53,40,.11);color:var(--bad);
}
#feedback.ok .fb-badge{background:var(--accent-dim);color:var(--accent)}
#feedback.warn .fb-badge{background:rgba(150,82,0,.11);color:var(--warn)}
.fb-title{font-size:13.5px;font-weight:500;color:var(--text);letter-spacing:.01em}
.fb-line{font-size:12.5px;line-height:1.85;color:var(--text-2);margin-bottom:4px}
.fb-line b{color:var(--text);font-weight:500}
.fb-why{font-size:12.5px;line-height:1.8;color:var(--text-2)}
.fb-why .hl{color:var(--warn)}
.fb-diff{
  font-family:var(--ipa);font-size:19px;letter-spacing:.06em;
  margin:9px 0 4px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.fb-diff .slot{padding:3px 9px;border-radius:7px;background:rgba(16,20,26,.04);border:1px solid var(--line)}
.fb-diff .slot.gone{background:rgba(184,53,40,.10);border-color:rgba(184,53,40,.30);color:#a52e22}
.fb-diff .slot.bad{background:rgba(150,82,0,.10);border-color:rgba(150,82,0,.28);color:var(--warn)}
.fb-diff .slot.good{background:var(--accent-dim);border-color:var(--accent-line);color:var(--accent)}
.fb-diff .arrow{color:var(--text-3);font-size:13px;font-family:var(--font)}
.fb-keys{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center}
.kbd{
  font-family:var(--mono);font-size:11px;color:var(--key);
  background:rgba(59,91,219,.07);border:1px solid rgba(59,91,219,.26);
  border-radius:5px;padding:2px 7px;line-height:1.5;
}
.fb-keys .lab{font-size:10.5px;color:var(--text-3);letter-spacing:.1em;margin-right:3px}
.fb-fix{
  margin-top:9px;padding-top:9px;border-top:1px dashed var(--line-strong);
  font-size:12.5px;color:var(--text-2);line-height:1.8;
}
.fb-fix b{color:var(--accent);font-weight:500}
.fb-fix .mono{font-family:var(--ipa);font-size:15px;color:var(--accent)}

#hint{
  margin-top:14px;font-size:13px;color:var(--text-3);
  font-family:var(--ipa);min-height:1.5em;line-height:1.8;letter-spacing:.03em;
}
#hint .ans{color:var(--text-2);font-size:15px}
#verify-warn{
  margin-top:16px;font-size:13px;color:var(--warn);display:none;
  line-height:1.9;text-align:left;max-width:520px;
}
#verify-warn b{color:var(--text)}
#action-btn{
  margin-top:22px;cursor:pointer;
  background:var(--accent);border:1px solid var(--accent);color:#fff;
  border-radius:99px;padding:11px 32px;font-size:14px;font-weight:500;letter-spacing:.05em;
  box-shadow:0 2px 8px rgba(13,110,103,.20);
  transition:all .3s var(--ease);
}
#action-btn:hover{background:#0a5a54;border-color:#0a5a54;color:#fff;box-shadow:0 6px 20px rgba(13,110,103,.28)}
#action-btn:active{transform:scale(.97)}

/* ===== 底部导航条 ===== */
#navbar{
  flex:none;border-top:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.82),var(--surface));
  padding:10px 22px;
  display:flex;align-items:center;gap:12px;
}
.nav-btn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
  border-radius:8px;padding:7px 14px;font-size:12.5px;cursor:pointer;
  display:flex;align-items:center;gap:6px;letter-spacing:.03em;
  transition:all .25s var(--ease);
}
.nav-btn:hover:not(:disabled){border-color:var(--accent-line);color:var(--accent);background:var(--accent-dim)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500;
  box-shadow:0 2px 8px rgba(13,110,103,.18)}
.nav-btn.primary:hover:not(:disabled){background:#0a5a54;border-color:#0a5a54;color:#fff}
.dots{display:flex;gap:3px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.dot{
  width:14px;height:4px;border-radius:99px;background:rgba(16,20,26,.14);
  cursor:pointer;border:none;padding:0;transition:all .25s var(--ease);
  position:relative;
}
.dot:hover{background:rgba(16,20,26,.30);transform:scaleY(1.6)}
.dot.done{background:rgba(13,110,103,.48)}
.dot.on{background:var(--accent);width:22px}
.kbdhint{
  font-size:10.5px;color:var(--text-3);letter-spacing:.08em;
  display:flex;gap:9px;flex:none;align-items:center;
}
.kbdhint span{white-space:nowrap}
.kbdhint i{font-style:normal;color:var(--text-2);font-family:var(--mono)}

/* ============ 右：规则 / 资料 ============ */
#right{
  background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
#right-head{flex:none;border-bottom:1px solid var(--line);padding:12px 12px 0}
.rt-tabs{display:flex;gap:2px}
.rt-tab{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--text-3);font-size:12px;padding:8px 11px;cursor:pointer;
  letter-spacing:.04em;transition:all .25s var(--ease);
  position:relative;display:flex;align-items:center;gap:5px;
}
.rt-tab:hover{color:var(--text-2)}
.rt-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.rt-tab .cnt{
  font-size:9px;background:var(--bad);color:#fff;border-radius:99px;
  min-width:15px;height:15px;padding:0 4px;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.rt-tab .cnt.hide{display:none}
#right-body{flex:1;overflow-y:auto;padding:14px 16px 28px}
.rt-pane{display:none}
.rt-pane.on{display:block}
.rt-h{
  font-size:10.5px;color:var(--accent);letter-spacing:.16em;
  margin:18px 0 8px;font-weight:500;
}
.rt-h:first-child{margin-top:0}
.rt-p{font-size:12px;color:var(--text-2);line-height:1.9;margin-bottom:10px}
.rt-note{
  font-size:11px;color:var(--text-3);line-height:1.85;
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:10px;
}
.rt-note b{color:var(--text-2)}
.rt-table{width:100%;border-collapse:collapse;font-size:12px}
.rt-table td,.rt-table th{
  border-bottom:1px solid var(--line);padding:6px 7px;text-align:left;vertical-align:middle;
}
.rt-table th{color:var(--text-3);font-weight:400;font-size:9.5px;letter-spacing:.13em}
.rt-table td.ipa{font-family:var(--ipa);color:var(--accent);font-size:15px;font-weight:500;white-space:nowrap}
.rt-table td.keys{font-family:var(--mono);color:var(--text-2);font-size:10.5px;white-space:nowrap}
.rt-table tr:hover td{background:rgba(16,20,26,.030)}
.rt-table tr.hl td{background:rgba(13,110,103,.07)}
.mini-say{
  background:none;border:none;color:var(--text-3);cursor:pointer;
  padding:1px 3px;margin-left:5px;border-radius:4px;transition:color .2s var(--ease);
}
.mini-say:hover{color:var(--accent)}
.mini-say svg{width:12px;height:12px;display:block}

.wrong-stat-row{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center;margin-bottom:7px;font-size:11.5px}
.ws-name{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-bar-wrap{grid-column:1/-1;height:3px;background:rgba(16,20,26,.10);border-radius:99px;overflow:hidden}
.ws-bar{height:100%;background:linear-gradient(90deg,var(--bad),rgba(184,53,40,.40));border-radius:99px;transition:width .8s var(--ease)}
.ws-num{color:var(--text-3);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
.wrong-row{
  display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  border:1px solid transparent;transition:all .2s var(--ease);
}
.wrong-row:hover{background:rgba(16,20,26,.035);border-color:var(--line)}
.wrong-row .ch{font-size:18px;font-weight:300;min-width:22px;text-align:center}
.wrong-row .py{font-size:10.5px;color:var(--text-3);letter-spacing:.04em}
.wrong-row .ipa{font-family:var(--ipa);font-size:14px;color:var(--accent);margin-left:auto}
.wrong-row .wt{font-size:9.5px;color:var(--bad);background:rgba(184,53,40,.10);padding:1px 5px;border-radius:4px}
.wrong-row .last{font-family:var(--ipa);font-size:12px;color:var(--warn);max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-empty{text-align:center;padding:36px 14px;color:var(--text-3);font-size:12px;line-height:2}
.rt-btn{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text-2);
  border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;
  transition:all .25s var(--ease);width:100%;
}
.rt-btn:hover{border-color:var(--accent-line);color:var(--accent)}
.rt-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.rt-btn.primary:hover{background:#0a5a54;border-color:#0a5a54;color:#fff}

/* 幽灵输入框 */
#ghost{
  position:fixed;left:50%;bottom:0;width:1px;height:1px;padding:0;margin:0;
  opacity:.01;border:none;outline:none;background:transparent;color:transparent;
  z-index:1;pointer-events:none;
}
#toast{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);
  z-index:100;background:var(--surface-3);border:1px solid var(--line-strong);
  color:var(--text-2);font-size:12px;padding:9px 16px;
  border-radius:99px;opacity:0;visibility:hidden;transition:all .3s var(--ease);
  pointer-events:none;max-width:70vw;text-align:center;
}
#toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

.fade{animation:fade .4s var(--ease) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pulse-ok{animation:pulseOk .5s var(--ease)}
@keyframes pulseOk{0%{box-shadow:0 0 0 0 rgba(13,110,103,.30)}100%{box-shadow:0 0 0 16px rgba(13,110,103,0)}}

@media (max-width:1240px){
  :root{--left-w:232px;--right-w:300px}
  #kbdhint{display:none}
}
@media (max-width:1040px){
  #app{grid-template-columns:var(--left-w) minmax(0,1fr) 0}
  #right{position:fixed;right:0;top:0;bottom:0;width:320px;z-index:60;box-shadow:-20px 0 60px rgba(16,20,26,.16);transform:translateX(100%);transition:transform .3s var(--ease)}
  #right.open{transform:none}
}
</style>
</head>
<body>

<div id="app">
  <!-- ================= 左：目录 / 进度 ================= -->
  <aside id="left">
    <div id="left-head">
      <div class="brand">
        <span class="brand-dot"></span>
        <span class="brand-name">IPA 打字课</span>
        <span class="brand-ver">WORKBENCH</span>
      </div>
      <div class="prog-row">
        <span class="prog-label" id="prog-label">课程进度</span>
        <span class="prog-num" id="prog-num">0 / 10</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
    <nav id="toc"></nav>
  </aside>

  <!-- ================= 中：主体 ================= -->
  <main id="stage">
    <div id="stage-head">
      <div class="crumb" id="crumb"></div>
      <div class="stage-tools">
        <button class="tool" id="sound-btn" title="发音开关" aria-label="发音开关">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z"/>
            <path id="sound-waves" d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 011 11"/>
            <path id="sound-slash" d="M4 4l16 16"/>
          </svg>
        </button>
        <button class="tool" id="right-toggle" title="规则 / 资料面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>
          </svg>
        </button>
      </div>
    </div>

    <div id="flow">
      <div class="stage-inner">
        <div id="prompt"></div>
        <div id="quiz-char"></div>
        <div id="quiz-pinyin"></div>
        <button id="say-btn" class="say-btn" style="display:none" aria-label="发音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4z"/>
            <path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 011 11"/>
          </svg>
          <span id="say-label">发音</span>
        </button>
        <div id="echo"></div>
        <div id="feedback"></div>
        <div id="hint"></div>
        <div id="verify-warn"></div>
        <button id="action-btn" style="display:none"></button>
      </div>
    </div>

    <div id="navbar">
      <button class="nav-btn" id="prev-btn" title="上一题（←）">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        上一题
      </button>
      <div class="dots" id="dots"></div>
      <span class="kbdhint">
        <span><i>←</i> 退</span><span><i>→</i> 进</span><span><i>↵</i> 提交</span>
      </span>
      <button class="nav-btn primary" id="next-btn" title="下一题（→）">
        下一题
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </main>

  <!-- ================= 右：规则 / 资料 ================= -->
  <aside id="right">
    <div id="right-head">
      <div class="rt-tabs">
        <button class="rt-tab on" data-pane="points">要点</button>
        <button class="rt-tab" data-pane="ref">速查</button>
        <button class="rt-tab" data-pane="rules">规则</button>
        <button class="rt-tab" data-pane="wrong">错题<span class="cnt hide" id="wrong-cnt">0</span></button>
      </div>
    </div>
    <div id="right-body">
      <div class="rt-pane on" id="pane-points"></div>
      <div class="rt-pane" id="pane-ref"></div>
      <div class="rt-pane" id="pane-rules"></div>
      <div class="rt-pane" id="pane-wrong"></div>
    </div>
  </aside>
</div>

<input id="ghost" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="text">
<div id="toast"></div>

<script>
const STAGES = [

// ---------------- 0 安装 ----------------
{ id:"install", nav:"安装", steps:[
  { k:"say", t:"欢迎来到 IPA 打字课。\n在这里，你将从零开始学会用 Keyman 输入法，把汉语拼音转写成国际音标（IPA）。" },
  { k:"say", t:"先弄清三件事的关系：\n汉语拼音，是你熟悉的注音符号；\n国际音标，是它真实读音的记法；\n而 Keyman，是把这些音标敲进电脑的输入法。\n\n本教程的任务很简单：看到拼音，打出音标。" },
  { k:"say", autoGuide:"ref", t:"对了，右上角这个问号图标是「汉语拼音 → 国际音标对照键位速查表」。\n之后学习过程中如果忘记某个音标对应哪个键，随时点开，退出按 Esc。" },
  { k:"say", t:"开始前，先花两分钟装好输入法。\n第一步：打开下面这个网站，下载并安装 Keyman 主程序，一路下一步即可。\n⚠️ 如果弹出「没有任何东西可以安装」说明你电脑已装过 Keyman，直接关掉就行——主程序不需要重复装。", link:"https://keyman.com/windows/",
    mac:{ t:"第一步：打开下面这个网站，下载 Mac 版 Keyman 主程序。下载后打开 .dmg，把 Keyman 拖进「应用程序」。\n⚠️ 首次打开如被系统拦截，到「系统设置 → 隐私与安全性」点「仍要打开」。", link:"https://keyman.com/mac/" } },
  { k:"say", t:"第二步：这是最关键的一步——打开下面这个页面，点「Install keyboard」下载 IPA (SIL) 键盘包（.kmp 文件），下载后**双击那个 .kmp 文件**导入到 Keyman。", link:"https://keyman.com/keyboards/sil_ipa",
    mac:{ t:"第二步：打开下面的页面，点「Install keyboard」下载 IPA (SIL) 键盘包（.kmp）。\n下载后双击 .kmp 导入；如果双击没反应，打开 Keyman Configuration，把 .kmp 拖进去。\n⚠️ Keyman 需要 17 或更高版本。", link:"https://keyman.com/keyboards/sil_ipa" } },
  { k:"say", t:"Mac 键位小抄（IPA 键盘使用英文键位）：\n>  = Shift + .　　<  = Shift + ,\n=  直接按　　|  = Shift + \\　　^  = Shift + 6\n若打出全角符号（＞ ＜ ＝ ｜ ＾），说明还在中文输入法，切到 IPA (SIL) 再打。" },
  { k:"say", t:"小提示：如果按 a 再按 = 却出现 =a，说明键盘被切到了 Before 模式。\nWindows：按 RAlt + - 切回 After。",
    mac:{ t:"小提示：如果按 a 再按 = 却出现 =a，说明键盘被切到了 Before 模式。\nMac：按 Option + - 切回 After。" } },
  { k:"say", t:"第三步：按 Win + 空格，在输入法列表里切换到「IPA (SIL)」。\n装好后就点下面的按钮。", btn:"我已装好，开始验证",
    mac:{ t:"第三步：点屏幕右上角菜单栏的输入法图标，选择「IPA (SIL)」。\n若列表里没有，打开 Keyman Configuration → Keyboard Layouts 确认已启用；再到「系统设置 → 键盘 → 输入法」添加 Keyman。\n忘记键位时，菜单栏 Input → Keyman → On-Screen Keyboard 会显示虚拟键盘。\n装好后就点下面的按钮。", btn:"我已装好，开始验证" } },
  { k:"verify", t:"验证一下：请依次按 a 和 = 。\n如果输入法装好了，屏幕上应该浮现 ɑ 。", a:"ɑ" },
]},

// ---------------- 1 单韵母 ----------------
{ id:"vowel", nav:"单韵母", steps:[
  { k:"say", t:"输入法没问题。接下来让我们从最基础的六个单韵母开始。" },
  { k:"say", t:"拼音 a 单用时，音标记作大写的 [A]。\n打法：按住 Shift 再按 A 。" },
  { k:"type", t:"照着打出这个音标：A", a:"A", keys:"Shift+A" },
  { k:"type", t:"现在自己来：打出拼音 a 对应的音标", a:"A", keys:"Shift+A" },
  { k:"say", t:"o、u、i 三个最省心——音标和拼音长得一样，直接按对应的字母就行。" },
  { k:"type", t:"照着打出这个音标：o", a:"o", keys:"o" },
  { k:"type", t:"照着打出这个音标：u", a:"u", keys:"u" },
  { k:"type", t:"打出拼音 i 对应的音标", a:"i", keys:"i" },
  { k:"say", t:"e 要特别小心：单用时它不写成 e，而是记作 [ɤ]。\n打法：先按大写 O，再按 > 。" },
  { k:"type", t:"照着打出这个音标：ɤ", a:"ɤ", keys:"O >" },
  { k:"type", t:"打出拼音 e 对应的音标", a:"ɤ", keys:"O >" },
  { k:"say", t:"最后一个：ü 记作 [y]，直接按 y 。" },
  { k:"type", t:"照着打出这个音标：y", a:"y", keys:"y" },
  { k:"type", t:"打出拼音 ü 对应的音标", a:"y", keys:"y" },
  { k:"say", t:"先埋个伏笔：ɤ 并不是 e 唯一的写法，「儿」er 也算 e 家族的成员——谜底后面揭晓。" },
  { k:"quiz", c:"啊", p:"a", a:"A", keys:"Shift+A" },
  { k:"quiz", c:"哦", p:"o", a:"o", keys:"o" },
  { k:"quiz", c:"鹅", p:"e", a:"ɤ", keys:"O >" },
  { k:"quiz", c:"衣", p:"i", a:"i", keys:"i" },
  { k:"quiz", c:"乌", p:"u", a:"u", keys:"u" },
  { k:"quiz", c:"鱼", p:"ü", a:"y", keys:"y" },
]},

// ---------------- 2 简单声母 ----------------
{ id:"cons1", nav:"声母·一", steps:[
  { k:"say", t:"现在你已经学会了六个单韵母。接下来，给它们配上第一批声母。" },
  { k:"say", t:"l、m、n 最省心，和拼音写法一样，直接按。" },
  { k:"type", t:"打出拼音 l 对应的音标", a:"l", keys:"l" },
  { k:"type", t:"打出拼音 m 对应的音标", a:"m", keys:"m" },
  { k:"type", t:"打出拼音 n 对应的音标", a:"n", keys:"n" },
  { k:"say", t:"f 也好打：学界主流记作不送气 [f]，直接按 f 即可。\n（也有教材记作送气 fʰ——两种写法本教程都算对。）" },
  { k:"type", t:"打出拼音 f 对应的音标", a:"f", keys:"f", acc:["fʰ"] },
  { k:"say", t:"接下来是第一条重要规律。\n拼音 d 其实是不送气清音，音标记作 [t]；\n拼音 t 才是送气的，记作 [tʰ]。" },
  { k:"say", t:"右上角小小的 ʰ 叫「送气符号」，表示紧跟一股气流。\n打法：先按 h，再按 ^ 。" },
  { k:"type", t:"照着打出这个送气符号：ʰ", a:"ʰ", keys:"h ^" },
  { k:"type", t:"打出拼音 d 对应的音标", a:"t", keys:"t" },
  { k:"type", t:"打出拼音 t 对应的音标（别忘了送气）", a:"tʰ", keys:"t h^", err:"少了送气符号 ʰ（先 h 再 ^）" },
  { k:"say", t:"易错提醒：拼音 b、d、g 都是不送气清音，要写成 p、t、k；\n拼音 p、t、k 才是送气的，后面要加 ʰ 。" },
  { k:"quiz", c:"大", p:"da", a:"tA", keys:"t Shift+A" },
  { k:"quiz", c:"了", p:"le", a:"lɤ", keys:"l O>" },
  { k:"quiz", c:"妈", p:"ma", a:"mA", keys:"m Shift+A" },
  { k:"quiz", c:"发", p:"fa", a:"fA", keys:"f Shift+A", acc:["fʰA"] },
  { k:"quiz", c:"踢", p:"ti", a:"tʰi", keys:"t h^ i", err:"t 是送气音，少了 ʰ" },
  { k:"quiz", c:"里", p:"li", a:"li", keys:"l i" },
  { k:"quiz", c:"木", p:"mu", a:"mu", keys:"m u" },
  { k:"quiz", c:"女", p:"nü", a:"ny", keys:"n y" },
]},

// ---------------- 3 声调 ----------------
{ id:"tone", nav:"声调", steps:[
  { k:"say", t:"前面我们学习了声母 l m n f d t 和六个单韵母。\n但音节还不完整——汉语是有声调的。" },
  { k:"say", t:"用「五度标记法」记声调：\n阴平 55，阳平 35，上声 214，去声 51；轻声不标。\n调值直接写在音标后面。" },
  { k:"say", t:"上标数字的打法：先按数字，再按 ^ 。\n比如 5 ^ 会变成 ⁵ 。" },
  { k:"type", t:"照着打出上标：⁵", a:"⁵", keys:"5 ^" },
  { k:"say", t:"从现在开始，所有练习都要带上声调。来试一试完整的。" },
  { k:"type", t:"打出「妈 mā」的音标（阴平 55）", a:"mA⁵⁵", keys:"m Shift+A 5^ 5^" },
  { k:"type", t:"打出「麻 má」的音标（阳平 35）", a:"mA³⁵", keys:"m Shift+A 3^ 5^" },
  { k:"type", t:"打出「马 mǎ」的音标（上声 214）", a:"mA²¹⁴", keys:"m Shift+A 2^ 1^ 4^" },
  { k:"type", t:"打出「骂 mà」的音标（去声 51）", a:"mA⁵¹", keys:"m Shift+A 5^ 1^" },
  { k:"say", t:"拓展一句：上声在词里常读「半上」21。本教程单字记 214，词内按 21 记。" },
  { k:"quiz", c:"大", p:"dà", a:"tA⁵¹", keys:"t A 5^ 1^" },
  { k:"quiz", c:"梨", p:"lí", a:"li³⁵", keys:"l i 3^ 5^" },
  { k:"quiz", c:"里", p:"lǐ", a:"li²¹⁴", keys:"l i 2^ 1^ 4^" },
  { k:"quiz", c:"力", p:"lì", a:"li⁵¹", keys:"l i 5^ 1^" },
  { k:"quiz", c:"发", p:"fā", a:"fA⁵⁵", keys:"f A 5^ 5^", acc:["fʰA⁵⁵"] },
  { k:"quiz", c:"罚", p:"fá", a:"fA³⁵", keys:"f A 3^ 5^", acc:["fʰA³⁵"] },
]},

// ---------------- 4 a 的音位变体 ----------------
{ id:"var-a", nav:"a 变体", steps:[
  { k:"say", t:"前面我们学习了声调。现在回到开头埋下的问题：\ne 在所有情形都打成 ɤ 吗？——不是。a 也一样。" },
  { k:"say", t:"同一个拼音字母，在不同环境里读音不同，记音时要写成不同音标。\n这叫「音位变体」。我们一个一个来看 a 的四种写法。" },
  { k:"say", t:"a 的第一变：在 ai、an 里读前元音 [a]，直接按 a 。" },
  { k:"type", t:"照着打出这个音标：a", a:"a", keys:"a" },
  { k:"say", t:"特殊：ia 里的 a 不是前元音 [a]，而是央低元音 [A]。\n打法：按大写 A（Shift + A）。" },
  { k:"type", t:"照着打出这个音标：iA", a:"iA", keys:"i Shift+A" },
  { k:"type", t:"ai 合起来，打出拼音 ai 对应的音标", a:"ai", keys:"a i" },
  { k:"type", t:"an 合起来，打出拼音 an 对应的音标", a:"an", keys:"a n" },
  { k:"say", t:"a 的第二变：单用或在辅音后读 [A]——你已经很熟了。" },
  { k:"say", t:"a 的第三变：在 ang、ao、ua 里读后元音 [ɑ]。\n打法：先按 a，再按 = 。" },
  { k:"type", t:"照着打出这个音标：ɑ", a:"ɑ", keys:"a =" },
  { k:"say", t:"顺便学一个新符号：ng 是舌根鼻音 [ŋ]，打法是 n 再 > 。" },
  { k:"type", t:"照着打出这个音标：ŋ", a:"ŋ", keys:"n >" },
  { k:"type", t:"ao 合起来，打出拼音 ao 对应的音标", a:"ɑu", keys:"a= u" },
  { k:"type", t:"ang 合起来，打出拼音 ang 对应的音标", a:"ɑŋ", keys:"a= n>" },
  { k:"say", t:"a 的第四变：在 ian、üan 里读 [æ]。\n打法：先按 a，再按 < 。" },
  { k:"type", t:"照着打出这个音标：æ", a:"æ", keys:"a <" },
  { k:"type", t:"ian 合起来，打出拼音 ian 对应的音标", a:"iæn", keys:"i a< n" },
  { k:"say", t:"易错提醒：ao、ang 里的 a 是后元音 ɑ；ian 里的 a 是 æ——都别顺手打成 A。" },
  { k:"quiz", c:"爱", p:"ài", a:"ai⁵¹", keys:"a i 5^ 1^" },
  { k:"quiz", c:"来", p:"lái", a:"lai³⁵", keys:"l a i 3^ 5^" },
  { k:"quiz", c:"马", p:"mǎ", a:"mA²¹⁴", keys:"m A 2^ 1^ 4^" },
  { k:"quiz", c:"捞", p:"lāo", a:"lɑu⁵⁵", keys:"l a= u 5^ 5^", err:"ao 里的 a 是后元音 ɑ（a=）" },
  { k:"quiz", c:"俩", p:"liǎ", a:"liA²¹⁴", keys:"l i Shift+A 2^ 1^ 4^", err:"ia 里的 a 是央低 A（Shift+A），不是前 a" },
  { k:"quiz", c:"天", p:"tiān", a:"tʰiæn⁵⁵", keys:"t h^ i a< n 5^ 5^", err:"ian 里的 a 读 æ（a<）" },
  { k:"quiz", c:"大", p:"dà", a:"tA⁵¹", keys:"t A 5^ 1^" },
]},

// ---------------- 5 e 的音位变体 ----------------
{ id:"var-e", nav:"e 变体", steps:[
  { k:"say", t:"前面我们学习了 a 的四种写法。\ne 也有四种——这正是开头那个问题的完整答案。" },
  { k:"say", t:"e 的第一变：辅音后或单用 → [ɤ]，你已经会了。" },
  { k:"say", t:"e 的第二变：在 ei、ui 里读 [e]，直接按 e 。" },
  { k:"type", t:"ei 合起来，打出拼音 ei 对应的音标", a:"ei", keys:"e i" },

   fix:"连着打 tʂ（先按 t，再按 s<）。"},
  {exp:"ts",parts:["t","s"],why:"ts 是一个完整的平舌塞擦音，不能拆开打。",
   fix:"连着打 ts（先按 t，再按 s）。"},
  {exp:"tɕʰ",parts:["t","ɕ","ʰ"],why:"q 是舌面送气塞擦音 tɕʰ，三个符号要连着打。",
   fix:"连着打 tɕʰ（先按 t，再按 c<，再按 h ^）。"},
  {exp:"tʂʰ",parts:["t","ʂ","ʰ"],why:"ch 是卷舌送气塞擦音 tʂʰ，三个符号要连着打。",
   fix:"连着打 tʂʰ（先按 t，再按 s<，再按 h ^）。"},
  {exp:"tsʰ",parts:["t","s","ʰ"],why:"c 是平舌送气塞擦音 tsʰ，三个符号要连着打。",
   fix:"连着打 tsʰ（先按 t，再按 s，再按 h ^）。"}
];
// 缩写规则：缺字时的针对性解释
const ABBREV=[
  {exp:"iou",miss:"o",why:"iu 是 iou 的缩写，记音要写全成 iou。"},
  {exp:"uei",miss:"e",why:"ui 是 uei 的缩写，记音要写全成 uei。"},
  {exp:"uən",miss:"ə",why:"un 是 uen 的缩写，记音要写全成 uən。"}
];
function unitLabel(u){
  if(!u)return"—";
  if(u.k==="tone")return u.t;
  if(u.k==="plain")return u.t;
  return u.t;
}
function whyFor(from,to){
  if(FAM[from+"|"+to])return FAM[from+"|"+to];
  return null;
}
function toneWhy(exp,got){
  if(exp.k==="tone"&&got.k==="plain")
    return "声调数字要用上标：先按数字，再按 ^。" + (exp.t.length?`（${exp.t} → 先按 ${[...exp.t].map(c=>c+" ^").join("，")}）`:"");
  if(exp.k==="tone"&&got.k==="tone"){
    if(got.t.length<exp.t.length&&exp.t.startsWith(got.t))
      return `调值只写了一半，应该写全 ${exp.t}（${exp.t.split("").map(c=>c+" ^").join("，")}）。`;
    return `调值不对：这里应该是 ${exp.t}（${exp.t.split("").map(c=>c+" ^").join("，")}），你打成了 ${got.t}。`;
  }
  if(exp.k==="tone"&&got.k==="sym")
    return `这里要标声调 ${exp.t}，不能直接打字母或普通符号。`;
  if(exp.k==="sym"&&(got.k==="tone"||got.k==="plain"))
    return `这里不该出现声调或数字：${exp.t} 是符号本身，不带调值。`;
  if(exp.k==="tone"&&got.k==="plain")
    return `声调数字要用上标：先按数字，再按 ^。`;
  if(exp.k==="sym"&&got.k==="sym"&&/^[0-9]+$/.test(got.t))
    return `这里应该是符号 ${exp.t}，不是数字 ${got.t}。`;
  return null;
}
/**
 * 生成诊断结果：定位到具体音位 + 原因 + 修改建议
 */
function diagnoseDetailed(expected, got){
  const issues=[];
  // 0) 整串级异常优先（全角 / 键序）
  if(/[＞＜＝｜＾]/.test(got))
    return[{pos:null,title:"打出了全角符号",why:"当前输入法还在中文模式，敲出的 ＞ ＜ ＝ ｜ ＾ 都是全角字符。",
      fix:`先切换到英文键盘或 IPA (SIL)（${KEY_HINT}），再重打一遍。`,keys:null}];
  if(got.includes("=a"))
    return[{pos:null,title:"键序反了",why:"你打出了「=a」，说明输入法处于 Before 模式（先修饰键后主键）。",
      fix:`按 ${IS_MAC?"Option + -":"RAlt + -"} 切回 After 模式，再打一次。`,keys:null}];

  const eu=tokenizeIPA(expected), gu=tokenizeIPA(got);
  const ops=align(eu,gu);
  let idx=0;
  for(let oi=0;oi<ops.length;oi++){
    const op=ops[oi];
    if(op.ty==="eq"){idx++;continue;}
    const e=op.x, g=op.y;

    // --- 组合字母 ng 与符号 ŋ 的互换 ---
    if((op.ty==="sub"||op.ty==="eq")&&(e.k==="combo"||g.k==="combo")){
      const comboSym=e.k==="combo"?"ŋ":e.t;
      const comboGot=g.k==="combo"?"ng":g.t;
      issues.push({pos:idx,exp:comboSym,got:comboGot,
        why:e.k==="combo"
          ?"ng 是两个字母，但舌根鼻音只有一个符号 ŋ。"
          :"这个位置是舌根鼻音 ŋ，不是两个字母 ng。",
        fix:e.k==="combo"
          ?"把 ng 合成一个符号 ŋ（先按 n，再按 >）。"
          :"把 ng 合成一个符号 ŋ（先按 n，再按 >）。",
        keys:UNIT_KEYS["ŋ"]});
      idx++; continue;
    }

    // --- 组合符号被拆开 / 被合成：把一个音位拆成多个，或把多个合成一个 ---
    // 形态 A：expected 一个组合音位，user 拆成 parts.length 个 token（del + ins*）
    if(op.ty==="del"){
      const combo=COMBO.find(c=>c.exp===e.t);
      if(combo&&oi+combo.parts.length<=ops.length){
        let ok=true;
        for(let k=0;k<combo.parts.length;k++){
          const nxt=ops[oi+k+1];
          if(!nxt||nxt.ty!=="ins"||nxt.y.t!==combo.parts[k]){ok=false;break;}
        }
        if(ok){
          issues.push({pos:idx,exp:combo.exp,got:combo.parts.join(""),why:combo.why,fix:combo.fix,
            keys:UNIT_KEYS[combo.exp]||toneKeys(combo.exp)});
          idx+=combo.parts.length+1; oi+=combo.parts.length; continue;
        }
      }
    }
    // 形态 B：expected 多个 token，user 合成一个组合音位（sub/ins + eq*）
    if(op.ty==="ins"||op.ty==="sub"){
      const gotToken=(op.ty==="ins"?op.y.t:op.x.t);
      const combo=COMBO.find(c=>c.exp===gotToken);
      if(combo&&oi+combo.parts.length<=ops.length){
        let ok=true;
        for(let k=0;k<combo.parts.length;k++){
          const nxt=ops[oi+1+k];
          if(!nxt||nxt.ty!=="del"||nxt.x.t!==combo.parts[k]){ok=false;break;}
        }
        if(ok){
          issues.push({pos:idx,exp:combo.parts.join(""),got:combo.exp,why:combo.why,fix:combo.fix,
            keys:UNIT_KEYS[combo.exp]||toneKeys(combo.exp)});
          idx+=combo.parts.length+1; oi+=combo.parts.length; continue;
        }
      }
    }
    // --- 送气符号被单独漏掉 / 多加 ---
    if(op.ty==="del"&&e.t==="ʰ"){
      issues.push({pos:idx,exp:"ʰ",got:null,
        why:"这个声母是送气音，音标后面必须跟送气符号 ʰ（拼音声母 p / t / k / c / ch / q 都要带）。",
        fix:"补上 ʰ（先按 h，再按 ^）。",keys:UNIT_KEYS["ʰ"]});
      idx++; continue;
    }
    if(op.ty==="ins"&&g.t==="ʰ"){
      issues.push({pos:idx,exp:null,got:"ʰ",
        why:"这个声母是不送气清音，不需要送气符号 ʰ。",
        fix:"删掉 ʰ。",keys:null});
      idx++; continue;
    }

    if(op.ty==="del"){
      // 缺字：查缩写规则
      let why=null, fix=null;
      for(const ab of ABBREV){
        if(expected.includes(ab.exp)&&ab.miss===e.t){why=ab.why;fix=`正确写法是 ${ab.exp}。`;break;}
      }
      if(!why){
        if(e.t==="ʰ"){why="这个声母是送气音，音标后面必须跟送气符号 ʰ。";fix=`在 ${e.t} 后面补上 ʰ（先按 h，再按 ^）。`;}
        else if(e.t==="ɺ"){why="儿化音节要在韵母后加儿化标记 ɺ。";fix=`在末尾补上 ɺ（大写 L，再按 >）。`;}
        else if(e.t==="ŋ"){why="韵尾 ng 要写成一个舌根鼻音符号 ŋ。";fix=`补上 ŋ（先按 n，再按 >）。`;}
        else if(e.k==="tone"){why=`这个词带调，需要标出调值 ${e.t}。`;fix=`在末尾补上 ${e.t}（${e.t.split("").map(c=>c+" ^").join("，")}）。`;}
        else{why=`正确写法里只有 ${e.t}，后面没有这个位置了。`;fix=`补上 ${e.t}。`;}
      }
      issues.push({pos:idx,exp:e.t,got:null,why,fix,keys:UNIT_KEYS[e.t]||toneKeys(e.t)});
    }else if(op.ty==="ins"){
      issues.push({pos:idx,exp:null,got:g.t,
        why:`这个位置不需要额外的符号，删掉后长度就对了。`,
        fix:`删掉 ${g.t}。`,keys:null});
    }else{ // sub
      let why=null,fix=null,keys=null;
      if(e.k==="tone"||g.k==="tone"||e.k==="plain"||g.k==="plain"){
        why=toneWhy(e,g);
        fix=why?null:`第 ${idx+1} 个音位应该是 ${e.t}，你打成了 ${g.t}。`;
      }else{
        why=whyFor(e.t,g.t);
        if(why){fix=`第 ${idx+1} 个音位应该是 ${e.t}。`;}
        else{
          // 跨音族的替换（如 ɤ→A）：标题已说明"哪个位置、该是什么"，
          // 此处补充增量信息——正确符号的按键与所属音类
          const cls=UNIT_KEYS[e.t]?"（这是一个辅音/元音符号）":"";
          why=`${e.t} 是本课记法里的正确写法${cls}，先按它对应的键打出来。`;
          fix=`把 ${g.t} 改成 ${e.t}。`;
        }
      }
      keys=UNIT_KEYS[e.t]||toneKeys(e.t);
      issues.push({pos:idx,exp:e.t,got:g.t,why,fix,keys});
    }
    idx++;
  }
  // 顺序颠倒检测：字符集相同但顺序不同
  if(!issues.length&&eu.map(u=>u.t).join("")!==gu.map(u=>u.t).join("")){
    issues.push({pos:null,exp:expected,got:got,why:"每个符号都对，但顺序反了。",
      fix:`正确顺序是 ${expected}。`,keys:unitKeys(expected)});
  }
  if(!issues.length){
    issues.push({pos:null,exp:expected,got:got,why:"整体写法与标准答案不一致。",
      fix:`标准答案是 ${expected}。`,keys:unitKeys(expected)});
  }
  return issues;
}

let AC=null;
function beep(freqs,dur=.11,type="sine",gap=.06,vol=.07){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    let t=AC.currentTime;
    freqs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();
      o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);
      g.gain.exponentialRampToValueAtTime(vol,t+.012);
      g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);t+=dur+gap;});
  }catch(e){}
}

function updateWrongCount(){
  const n=Object.keys(wrongBook).length;
  const el=$("wrong-cnt");
  el.textContent=n>9?"9+":n;
  el.classList.toggle("hide",n===0);
}
function buildWrongPane(){
  const box=$("pane-wrong");box.innerHTML="";
  const keys=Object.keys(wrongBook);
  if(!keys.length){
    box.innerHTML=`<div class="rt-empty">还没有错题<br>答错时会自动收进这里</div>`;
    return;
  }
  const sorted=keys.map(k=>({key:k,...wrongBook[k]}))
    .sort((a,b)=>(b.wrongCount||1)-(a.wrongCount||1));
  const h=document.createElement("div");h.className="rt-h";h.textContent="按版块统计";box.appendChild(h);
  const stageMap={};
  sorted.forEach(it=>{
    const si=it.type==="free"?"free":parseInt(it.key.split("-")[0]);
    const name=it.type==="free"?"自由练习":(STAGES[si]&&STAGES[si].nav||"—");
    if(!stageMap[name])stageMap[name]={count:0,items:0};
    stageMap[name].count+=(it.wrongCount||1);stageMap[name].items++;
  });
  const maxC=Math.max(...Object.values(stageMap).map(s=>s.count));
  Object.entries(stageMap).sort((a,b)=>b[1].count-a[1].count).forEach(([name,s])=>{
    const row=document.createElement("div");row.className="wrong-stat-row";
    row.innerHTML=`<span class="ws-name">${name}</span><span class="ws-num">${s.count} 次 · ${s.items} 题</span>
      <span class="ws-bar-wrap"><span class="ws-bar" style="width:${(s.count/maxC*100).toFixed(0)}%"></span></span>`;
    box.appendChild(row);
  });
  const h2=document.createElement("div");h2.className="rt-h";h2.textContent=`错题清单（${keys.length}）`;box.appendChild(h2);
  const wrap=document.createElement("div");
  sorted.forEach(it=>{
    const si=it.type==="free"?null:parseInt(it.key.split("-")[0]);
    const src=it.type==="free"?"自由":(STAGES[si]&&STAGES[si].nav||"—");
    const row=document.createElement("div");row.className="wrong-row";
    const py=it.p||(it.type==="free"?(FREE_PY[it.c]||""):"");
    row.innerHTML=`<span class="ch">${it.c||"—"}</span>
      <span class="py">${py||src}</span>
      ${it.lastWrongInput?`<span class="last">${it.lastWrongInput}</span>`:""}
      <span class="wt">×${it.wrongCount||1}</span>
      <span class="ipa">${it.a||"—"}</span>`;
    const del=document.createElement("button");del.className="mini-say";del.title="移除";
    del.innerHTML="✕";del.style.fontSize="11px";
    del.addEventListener("click",ev=>{ev.stopPropagation();
      delete wrongBook[it.key];save();updateWrongCount();buildWrongPane();});
    row.appendChild(del);
    wrap.appendChild(row);
  });
  box.appendChild(wrap);
  const b=document.createElement("button");b.className="rt-btn primary";b.style.marginTop="12px";
  b.textContent="进入错题强化练习";
  b.addEventListener("click",()=>{enterWrongDrill();});
  box.appendChild(b);
}

function render(){
  swap(()=>{
    wrong=0;
    const st=cur();
    if(st.t){
      revealText(promptEl,st.t);
      if(st.link){
        const a=document.createElement("a");
        a.href=st.link;a.target="_blank";a.rel="noopener";
        a.textContent=" "+st.link.replace("https://","");
        a.style.animationDelay=(st.t.length*15)+"ms";a.className="ch";
        promptEl.appendChild(a);
      }
    }
    echoEl.style.display=(st.k==="say")?"none":"";
    if(st.k==="quiz"){charEl.textContent=st.c;pyEl.textContent=st.p||"";}

    const answered=isStepDone()&&(st.k==="type"||st.k==="quiz");
    if(answered){
      echoEl.textContent=st.a;echoEl.classList.add("ok");
      hintEl.textContent="这题你答对过 · 按 → 继续，或点下方圆点回看";
      ghost.value="";
      renderFeedback("ok","已掌握","这题之前答对过，可以直接跳过。",null,null,null);
    }
    if(st.k==="quiz"&&st.c){
      sayLabel.textContent="读「"+st.c+"」";sayBtn.style.display="";
      sayBtn.onclick=()=>speakText(st.c);
      if(S.autoSpeak&&!answered)setTimeout(()=>speakText(st.c),450);
    }else if((st.k==="type"||st.k==="verify")&&st.a){
      sayLabel.textContent="听音标";sayBtn.style.display="";
      sayBtn.onclick=()=>speakIPA(st.a);
    }
    if(st.k==="verify"){
      clearTimeout(verifyTimer);
      verifyTimer=setTimeout(()=>{
        if(mode!=="free"&&cur()&&cur().k==="verify"){
          warnEl.innerHTML=`等了一会儿还没看到音标。先点一下页面让输入框拿到焦点，再确认已切到 <b>IPA (SIL)</b>。<br>实在不行可以跳过这一步。`;
          warnEl.style.display="";
          btnEl.textContent="暂时跳过，继续学习";btnEl.style.display="";
          btnEl.onclick=()=>{if(!busy){wrong=0;next();}};
        }
      },4000);
    }
    if(st.k==="say"){
      if(st.btn){btnEl.textContent=st.btn;btnEl.style.display="";btnEl.onclick=()=>{if(!busy&&mode!=="free")next();};}
    }
    renderCrumb();renderDots();renderTOC();
    if(rightTab==="points")buildPointsPane();
    syncNavBtns();
  });
  save();
}
function syncNavBtns(){
  if(mode==="free"){
    prevBtn.disabled=freeHistory.length<2;
    nextBtn.textContent="下一题";nextBtn.disabled=false;
    return;
  }
  prevBtn.disabled=(S.si===0&&S.pi===0);
  const last=S.pi>=STAGES[S.si].steps.length-1;
  nextBtn.disabled=false;
  nextBtn.textContent=last?"完成本节":"下一题";
}
function stageDone(){
  const stgIdx=S.si;
  busy=true;                       // 动画期间锁定，防止重复触发
  if(STAGES[stgIdx].id!=="install"&&!S.completed.includes(stgIdx))S.completed.push(stgIdx);
  save();sfxStage();
  swap(()=>{
    revealText(promptEl,"✓ 「"+STAGES[stgIdx].nav+"」 完成",24);
    hintEl.textContent="下一节："+(STAGE_LIST.find(s=>s.idx>stgIdx)||{nav:"自由练习"}).nav;
  });
  syncNavBtns();
  setTimeout(()=>{
    S.si=stgIdx+1;S.pi=0;
    if(S.si>=STAGES.length){busy=false;courseDone();return;}
    busy=false;render();
  },900);
}
function startNext(){
  S.si++;S.pi=0;
  if(S.si>=STAGES.length){busy=false;return courseDone();}
  busy=false;render();
}
function courseDone(){
  S.done=true;
  STAGES.forEach((_,i)=>{if(STAGES[i].id!=="install"&&!S.completed.includes(i))S.completed.push(i);});
  save();sfxStage();
  swap(()=>{
    revealText(promptEl,"很棒！你已经学会了汉语 IPA 记音的全部内容：21 个声母、全部韵母与 a / e / i 音位变体、声调与变调、儿化和零声母。",20);
    btnEl.textContent="进入自由练习";btnEl.style.display="";btnEl.onclick=enterFree;
  });
  renderTOC();renderDots();syncNavBtns();
}
function next(){
  if(busy)return;
  if(mode==="free")return nextFree();
  S.pi++;
  if(S.pi>=STAGES[S.si].steps.length)return stageDone();
  render();
}
function prev(){
  if(busy)return;
  if(mode==="free")return prevFree();
  if(S.pi>0){S.pi--;render();return;}
  if(S.si>0){S.si--;S.pi=STAGES[S.si].steps.length-1;render();}
}

// ---------- 判错 / 判对 ----------
function acceptList(st){return [st.a,...(st.acc||[])].map(norm);}
function succeed(){
  busy=true;echoEl.classList.add("ok");sfxOk();
  if(mode==="learn"&&(cur().k==="type"||cur().k==="quiz")){
    S.doneSteps[stepKey()]=true;
    const k=stepKey();
    if(wrongBook[k]){delete wrongBook[k];updateWrongCount();}
    save();
  }
  renderFeedback("ok","正确","这一步已经掌握，音标写法与声调都对上了。",null,null,null);
  setTimeout(()=>{busy=false;mode==="free"?renderFree():next();},900);
}
function addWrong(key,entry){
  if(wrongBook[key]){
    wrongBook[key].wrongCount=(wrongBook[key].wrongCount||1)+1;
    wrongBook[key].lastWrong=Date.now();
    wrongBook[key].lastWrongInput=entry.lastWrongInput;
  }else{wrongBook[key]={...entry,wrongCount:1,lastWrong:Date.now()};}
  save();updateWrongCount();
}
function fail(st,v,key,extra){
  wrong++;
  sfxBad();
  echoEl.classList.add("bad","shake");
  setTimeout(()=>echoEl.classList.remove("shake"),420);

  const ctx={lastWrongInput:v||""};
  if(key){
    ctx.type="learn";
    const sp=STAGES[S.si].steps[S.pi];
    ctx.c=sp.k==="quiz"?sp.c:"";
    ctx.p=sp.k==="quiz"?(sp.p||""):"";
    ctx.a=sp.a;
    addWrong(key,ctx);
  }else{
    const q=FREE[lastFree];
    ctx.type="free";ctx.c=q.c;ctx.p=FREE_PY[q.c]||"";ctx.a=q.a[0];
    addWrong("free-"+lastFree,ctx);
  }

  // ===== 新的定位式反馈 =====
  const issues=diagnoseDetailed(st.a,v);
  const it=issues[0];
  const more=issues.length>1?`（另外还有 ${issues.length-1} 处不同）`:"";
  let title,why,fix,keys,rows;

  if(it.exp&&it.got){
    title=`第 ${it.pos+1} 个音位不对：应该是 ${it.exp}，你打成了 ${it.got}`;
    rows=[{cls:"bad",txt:it.got},{cls:"arrow",txt:"→"},{cls:"good",txt:it.exp}];
    why=it.why;
    keys=it.keys;
    fix=it.fix?`${it.fix}`:`改成 <span class="mono">${it.exp}</span> 再试一次。`;
  }else if(it.exp&&!it.got){
    title=`漏掉了第 ${it.pos+1} 个音位 ${it.exp}`;
    rows=[{cls:"gone",txt:"（缺）"},{cls:"arrow",txt:"→"},{cls:"good",txt:it.exp}];
    why=it.why;keys=it.keys;fix=it.fix||`补上 <span class="mono">${it.exp}</span>。`;
  }else if(!it.exp&&it.got){
    title=`多打了 ${it.got}`;
    rows=[{cls:"bad",txt:it.got},{cls:"arrow",txt:"→"},{cls:"gone",txt:"（删）"}];
    why=it.why;fix=it.fix||"删掉多余的符号。";
  }else{
    title=it.title||"再试一次";
    why=it.why;fix=it.fix;keys=it.keys;
  }
  // 题库自带的 err 作为补充（不覆盖定位信息）
  if(st.err&&(!why||why.length<10)) why=`${why?why+" ":""}<span class="hl">${st.err}</span>`;
  if(extra) why=`${why||""}${extra}`;

  // 第 2 次错 → 补充完整答案与按键（原版三级提示的后两级保留）
  if(wrong>=2){
    if(it.pos!=null){
      title=it.got
        ?`第 ${it.pos+1} 个音位不对：应该是 ${it.exp}，你打成了 ${it.got}`
        :`第 ${it.pos+1} 个音位不对：你漏掉了 ${it.exp}`;
    }
    fix=`完整答案是 <span class="mono">${st.a}</span>${more}。照着按键敲一遍，再重打一次。`;
    keys=unitKeys(st.a);
  }
  renderFeedback("bad",title,why,fix,keys,rows);
  hintEl.textContent="";
  ghost.value="";echoEl.textContent="";echoEl.classList.remove("bad");
}
function submit(){
  if(busy)return;
  if(mode==="free")return submitFree();
  const st=cur();
  if(isStepDone()&&(st.k==="type"||st.k==="quiz"))return next();
  if(st.k==="say")return next();
  const v=norm(ghost.value);
  const key=S.si+"-"+S.pi;
  if(st.k==="verify"){
    if(v===norm(st.a))return succeed();
    if(/^a=?$/.test(ghost.value.trim())){
      warnEl.innerHTML=`你打出的是原始字母 <b>a=</b>，不是音标 <b>ɑ</b>。<br>请检查：<br>①是否按 <b>${KEY_HINT}</b> 切到「IPA (SIL)」<br>②是否先点了一下页面（让输入框拿到焦点）`;
    }else{
      warnEl.innerHTML="没打出想要的音标？确认输入法已切到 <b>IPA (SIL)</b>。<br>如果暂时打不出来，可以先跳过。";
    }
    warnEl.style.display="";
    btnEl.textContent="暂时跳过，继续学习";btnEl.style.display="";
    btnEl.onclick=()=>{if(!busy){wrong=0;next();}};
    ghost.value="";echoEl.textContent="";
    return;
  }
  if(!v)return;
  if(acceptList(st).includes(v))succeed();
  else fail(st,v,key);
}
ghost.addEventListener("input",()=>{
  const v=ghost.value;
  echoEl.textContent=v;
  echoEl.classList.remove("pop");void echoEl.offsetWidth;echoEl.classList.add("pop");
  if(busy)return;
  if(mode==="learn"){
    const st=cur();const nv=norm(v);
    if(st.k==="type"&&acceptList(st).includes(nv))succeed();
    if(st.k==="verify"){
      if(nv===norm(st.a)){clearTimeout(verifyTimer);warnEl.style.display="none";btnEl.style.display="none";succeed();}
      else if(v.length>=2){
        clearTimeout(verifyTimer);
        warnEl.innerHTML=/^a=?$/.test(v.trim())
          ?`你打出的是原始字母 <b>a=</b>，不是音标 <b>ɑ</b>。<br>①是否按 <b>${KEY_HINT}</b> 切到「IPA (SIL)」<br>②是否先点了一下页面`
          :"还没打出正确的音标。确认输入法切到了 <b>IPA (SIL)</b>。";
        warnEl.style.display="";
        btnEl.textContent="暂时跳过，继续学习";btnEl.style.display="";
        btnEl.onclick=()=>{if(!busy){wrong=0;next();}};
      }
    }
  }
});
ghost.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Enter"||e.key===" "||e.key==="ArrowRight"){
    e.preventDefault();e.stopPropagation();
    if(refOverlayOpen())return;
    if(!busy)submit();
  }
});
function refOverlayOpen(){return false;}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(busy)return;
  if(e.key==="ArrowLeft"){e.preventDefault();prev();}
  else if(e.key==="ArrowRight"&&document.activeElement!==ghost){e.preventDefault();submit();}
});
prevBtn.addEventListener("click",()=>{if(!busy)prev();});
nextBtn.addEventListener("click",()=>{if(!busy)next();});

// ============================================================
// 自由练习
// ============================================================
function enterFree(){
  mode="free";
  freeDeck=FREE.map((_,i)=>i);shuffle(freeDeck);freeDeckIdx=0;freeHistory=[];
  renderTOC();renderDots();renderFree();switchRightTab("points");
}
function exitFree(){
  mode="learn";
  for(let i=0;i<STAGES.length;i++){
    if(STAGES[i].id==="install")continue;
    if(!S.completed.includes(i)){S.si=i;S.pi=0;break;}
    S.si=i;S.pi=0;
  }
  renderTOC();renderDots();render();
}
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}}
function nextFreeIndex(){
  if(freeDeckIdx>=freeDeck.length){shuffle(freeDeck);freeDeckIdx=0;}
  let idx=freeDeck[freeDeckIdx++];
  if(idx===lastFree&&FREE.length>1)idx=freeDeck[freeDeckIdx++%freeDeck.length];
  return idx;
}
function renderFree(){
  swap(()=>{
    wrong=0;
    lastFree=nextFreeIndex();
    freeHistory.push(lastFree);if(freeHistory.length>40)freeHistory.shift();
    revealText(promptEl,"打出这个字的国际音标（含声调）",18);
    charEl.textContent=FREE[lastFree].c;
    sayLabel.textContent="读「"+FREE[lastFree].c+"」";sayBtn.style.display="";
    sayBtn.onclick=()=>speakText(FREE[lastFree].c);
    if(S.autoSpeak)setTimeout(()=>speakText(FREE[lastFree].c),450);
    renderCrumb();renderDots();renderTOC();syncNavBtns();
    if(rightTab==="points")buildPointsPane();
  });
}
function submitFree(){
  const q=FREE[lastFree];
  const v=norm(ghost.value);
  if(!v)return;
  if(q.a.map(norm).includes(v)){
    freeN++;S.freeN=freeN;
    const wk="free-"+lastFree;
    if(wrongBook[wk]){delete wrongBook[wk];updateWrongCount();}
    save();
    busy=true;echoEl.classList.add("ok");sfxOk();
    renderFeedback("ok","正确",`「${q.c}」${FREE_PY[q.c]||""} 的音标写对了。`,null,null,null);
    setTimeout(()=>{busy=false;renderFree();},900);
  }else{
    wrong++;sfxBad();
    echoEl.classList.add("bad","shake");
    setTimeout(()=>echoEl.classList.remove("shake"),420);
    const ctx={type:"free",c:q.c,p:FREE_PY[q.c]||"",a:q.a[0],lastWrongInput:v||""};
    addWrong("free-"+lastFree,ctx);
    const st={a:q.a[0],keys:FREE_KEYS[q.c]||"",err:null};
    fail(st,v,null);
  }
}
function prevFree(){
  if(freeHistory.length<2)return;
  freeHistory.pop();                 // 丢掉当前题，回到上一题
  lastFree=freeHistory[freeHistory.length-1];
  renderFreeCurrent();
}
function nextFree(){
  renderFree();                       // 抽新题并压栈
}
// 渲染当前 lastFree（不重新抽题），用于前进/回退
function renderFreeCurrent(){
  swap(()=>{
    wrong=0;
    revealText(promptEl,"打出这个字的国际音标（含声调）",18);
    charEl.textContent=FREE[lastFree].c;
    sayLabel.textContent="读「"+FREE[lastFree].c+"」";sayBtn.style.display="";
    sayBtn.onclick=()=>speakText(FREE[lastFree].c);
    if(S.autoSpeak)setTimeout(()=>speakText(FREE[lastFree].c),450);
    renderCrumb();renderDots();renderTOC();syncNavBtns();
    if(rightTab==="points")buildPointsPane();
  });
}

// ---------- 错题强化练习 ----------
let drill=null;
function enterWrongDrill(){
  const keys=Object.keys(wrongBook);
  if(!keys.length){toast("还没有错题");return;}
  const items=keys.map(k=>({key:k,...wrongBook[k]}));
  drill=weightedPick(items);
  mode="free";
  renderTOC();renderDots();renderDrill();
}
function weightedPick(items){
  const total=items.reduce((s,it)=>s+(it.wrongCount||1),0);
  let r=Math.random()*total;
  for(const it of items){r-=(it.wrongCount||1);if(r<=0)return it;}
  return items[items.length-1];
}
function renderDrill(){
  swap(()=>{
    wrong=0;
    revealText(promptEl,"错题强化 · 写出这个字的音标",18);
    charEl.textContent=drill.c||"";
    pyEl.textContent=drill.p||"";
    sayLabel.textContent="读「"+(drill.c||"")+"」";sayBtn.style.display="";
    sayBtn.onclick=()=>speakText(drill.c||"");
    if(S.autoSpeak)setTimeout(()=>speakText(drill.c||""),450);
    renderCrumb();renderDots();renderTOC();syncNavBtns();
  });
}
document.addEventListener("keydown",e=>{
  if(drill&&(e.key==="Enter"||e.key===" "||e.key==="ArrowRight")){
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    e.preventDefault();
    const v=norm(ghost.value);if(!v||!drill)return;
    if(v===norm(drill.a)){
      sfxOk();echoEl.classList.add("ok");
      renderFeedback("ok","正确","这道错题已经拿下，已从错题本移出。",null,null,null);
      delete wrongBook[drill.key];save();updateWrongCount();buildWrongPane();
      setTimeout(()=>{drill=null;renderFree();},900);
    }else{
      sfxBad();echoEl.classList.add("bad");
      const issues=diagnoseDetailed(drill.a,v);
      const it=issues[0];
      renderFeedback("bad",`第 ${it.pos+1} 个音位不对：应该是 ${it.exp}，你打成了 ${it.got}`,it.why,
        `完整答案是 <span class="mono">${drill.a}</span>，你上次写的是 <span class="mono">${v}</span>。`,
        unitKeys(drill.a),[{cls:"bad",txt:it.got},{cls:"arrow",txt:"→"},{cls:"good",txt:it.exp}]);
      ghost.value="";echoEl.textContent="";echoEl.classList.remove("bad");
    }
  }
});

// ============================================================
// 启动
// ============================================================
buildRefPane();
buildRulesPane();
updateWrongCount();
if(S.done){mode="free";enterFree();}
else{renderTOC();renderDots();render();}
switchRightTab("points");
</script>
